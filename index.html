<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mochimo Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --brand-dark:#1D2B2E; --brand-mint:#15DC97;
  --bg:#EDF1F4; --paper:#FFFFFF; --ink:#18212E; --muted:#56627A; --line:#CBD4DE;
  --violet:#4B36C7; --violet-soft:#E6E2FB; --amber:#B86E00; --amber-soft:#FDF0DA;
  --green:#1C7C54; --green-soft:#DDF3E8; --red:#B3261E; --red-soft:#FBE3E1;
  --l1:#2F7FB8; --l2:#4B36C7; --l3:#1C7C54; --l4:#B86E00;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151D; --paper:#18202B; --ink:#E7ECF3; --muted:#9AA7BA; --line:#2C3747;
    --violet:#A597FF; --violet-soft:#262045; --amber:#F2B45A; --amber-soft:#33270F;
    --green:#5BD39C; --green-soft:#12301F; --red:#FF8A80; --red-soft:#3A1715;
    --l1:#6DB6E8; --l2:#A597FF; --l3:#5BD39C; --l4:#F2B45A;
  }
}
:root[data-theme="dark"]{
  --bg:#10151D; --paper:#18202B; --ink:#E7ECF3; --muted:#9AA7BA; --line:#2C3747;
  --violet:#A597FF; --violet-soft:#262045; --amber:#F2B45A; --amber-soft:#33270F;
  --green:#5BD39C; --green-soft:#12301F; --red:#FF8A80; --red-soft:#3A1715;
  --l1:#6DB6E8; --l2:#A597FF; --l3:#5BD39C; --l4:#F2B45A;
}
*{box-sizing:border-box}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1.0625rem;line-height:1.65}
a{color:var(--violet)}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px;border-radius:4px}
img,svg{max-width:100%}
button{font:inherit;cursor:pointer}

/* top bar */
.topbar{position:sticky;top:0;z-index:10;background:var(--brand-dark);border-bottom:1px solid #2E3E42}
.topbar-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:1.5rem;padding:.7rem 1.5rem}
.logo{font-family:var(--display);font-weight:800;font-size:1.15rem;text-decoration:none;color:#fff;display:flex;align-items:center;gap:.5rem;white-space:nowrap}
.logo-mark{width:2rem;height:2rem;border-radius:50%;display:block}
.topnav{display:flex;gap:.25rem;flex:1;overflow-x:auto}
.topnav a{text-decoration:none;color:#A9BCC0;padding:.4rem .75rem;border-radius:8px;white-space:nowrap;font-size:.97rem}
.topnav a:hover{color:#fff;background:#2A3B3F}
.topnav a.active{color:var(--brand-mint);background:#2A3B3F;font-weight:700}
.top-progress{display:flex;align-items:center;gap:.5rem;font-size:.85rem;color:#A9BCC0;white-space:nowrap}
.ring{--p:0;width:1.9rem;height:1.9rem;border-radius:50%;background:conic-gradient(var(--brand-mint) calc(var(--p)*1%),#3A4B4F 0)}
.ring::after{content:"";display:block;width:1.3rem;height:1.3rem;border-radius:50%;background:var(--brand-dark);margin:.3rem}
.theme-btn{background:none;border:1px solid #3A4B4F;color:#A9BCC0;border-radius:8px;padding:.35rem .6rem;font-size:.85rem}

.wrap{max-width:1180px;margin:0 auto;padding:0 1.5rem 5rem}

/* home */
.home-hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:3rem;align-items:center;padding:4rem 0 3rem}
.home-hero h1{font-family:var(--display);font-weight:800;font-size:clamp(2.3rem,5vw,3.8rem);line-height:1.02;letter-spacing:-.02em;margin:0 0 1.2rem}
.home-hero p{font-size:1.15rem;color:var(--muted);max-width:34rem;margin:0 0 1.5rem}
.btn{display:inline-block;background:var(--brand-dark);color:var(--brand-mint);text-decoration:none;border:0;border-radius:10px;padding:.75rem 1.2rem;font-weight:700}
.btn.ghost{background:none;color:var(--ink);border:1.5px solid var(--line)}
.btn-row{display:flex;flex-wrap:wrap;gap:.6rem}
.hero-ladder{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:1.5rem}
.hero-ladder p{margin:0 0 .8rem;font-size:.95rem;color:var(--muted)}
.hl-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.hl-grid span{aspect-ratio:1;border-radius:6px;background:var(--bg);border:1px solid var(--line);transition:background .4s,border-color .4s}
.hl-grid span.on{background:var(--violet);border-color:var(--violet)}
.hl-grid span.top{background:var(--green);border-color:var(--green)}
.hl-cap{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);margin-top:.5rem}

.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:0 0 3.5rem}
.facts div{background:var(--paper);padding:1.1rem 1.25rem}
.facts b{display:block;font-family:var(--display);font-size:1.25rem}
.facts span{color:var(--muted);font-size:.92rem}

.section-title{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,3vw,2.2rem);letter-spacing:-.01em;margin:0 0 .4rem}
.section-sub{color:var(--muted);margin:0 0 1.75rem;max-width:40rem}

/* curriculum */
.levels{display:grid;gap:1.25rem}
.level{background:var(--paper);border:1px solid var(--line);border-radius:16px;display:grid;grid-template-columns:260px minmax(0,1fr);overflow:hidden}
.level-head{padding:1.5rem;border-right:1px solid var(--line);position:relative}
.level-head::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--lc)}
.level-tag{font-family:var(--display);font-weight:700;color:var(--lc);font-size:.95rem;margin:0}
.level-head h3{font-family:var(--display);font-weight:800;font-size:1.45rem;line-height:1.15;margin:.2rem 0 .5rem}
.level-head p{color:var(--muted);font-size:.95rem;margin:0 0 .8rem}
.level-meta{font-size:.85rem;color:var(--muted)}
.level-bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:.8rem}
.level-bar i{display:block;height:100%;background:var(--lc);width:0}
.level-lessons{list-style:none;margin:0;padding:.5rem}
.level-lessons a{display:grid;grid-template-columns:2.2rem 1fr auto;gap:.75rem;align-items:center;padding:.7rem .8rem;border-radius:10px;text-decoration:none;color:var(--ink)}
.level-lessons a:hover{background:var(--bg)}
.lnum{width:2rem;height:2rem;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:.85rem;color:var(--muted)}
.done .lnum{background:var(--green);border-color:var(--green);color:var(--paper)}
.ltitle b{display:block;font-weight:700;line-height:1.3}
.ltitle span{font-size:.88rem;color:var(--muted)}
.lmin{font-size:.85rem;color:var(--muted);white-space:nowrap}
.capstone{margin-top:1.25rem;background:var(--brand-dark);color:#fff;border-radius:16px;padding:1.75rem;display:flex;flex-wrap:wrap;gap:1rem;align-items:center;justify-content:space-between}
.capstone h3{font-family:var(--display);font-size:1.4rem;margin:0 0 .25rem}
.capstone p{margin:0;opacity:.8;max-width:36rem}
.capstone .btn{background:var(--brand-mint);color:var(--brand-dark)}
.hero-logo{width:84px;height:84px;border-radius:50%;display:block;margin-bottom:1.25rem}
.cert-logo{width:88px;height:88px;border-radius:50%;display:block;margin:0 auto 1rem}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn:not(.ghost){background:var(--brand-mint);color:var(--brand-dark)}}
:root[data-theme="dark"] .btn:not(.ghost){background:var(--brand-mint);color:var(--brand-dark)}

/* lesson view */
.lesson-layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:2.5rem;padding-top:2rem}
.side{position:sticky;top:5rem;align-self:start}
.side .level-tag{margin-bottom:.4rem}
.side ol{list-style:none;padding:0;margin:0}
.side a{display:grid;grid-template-columns:1.8rem 1fr;gap:.5rem;align-items:center;padding:.45rem .5rem;border-radius:8px;text-decoration:none;color:var(--ink);font-size:.93rem;line-height:1.3}
.side a .lnum{width:1.6rem;height:1.6rem;font-size:.75rem}
.side a.current{background:var(--paper);font-weight:700}
.side a:hover{background:var(--paper)}
.side-back{display:inline-block;margin-bottom:1rem;font-size:.9rem}
article.lesson{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:2.5rem;max-width:50rem}
.crumb{font-size:.9rem;color:var(--muted);margin:0}
.crumb b{color:var(--lc)}
.lesson h1{font-family:var(--display);font-weight:800;font-size:clamp(1.7rem,3.5vw,2.4rem);line-height:1.1;letter-spacing:-.01em;margin:.3rem 0 .8rem}
.objectives{background:var(--bg);border-radius:12px;padding:1rem 1.25rem;margin:0 0 1.5rem}
.objectives p{margin:0 0 .3rem;font-weight:700}
.objectives ul{margin:0;padding-left:1.2rem}
.lesson h2{font-family:var(--display);font-weight:700;font-size:1.25rem;margin:2rem 0 .4rem}
.lesson p,.lesson li{max-width:42rem}
.analogy,.warn,.danger{padding:.9rem 1.1rem;border-radius:0 10px 10px 0;margin:1.25rem 0}
.analogy{border-left:4px solid var(--violet);background:var(--violet-soft)}
.warn{border-left:4px solid var(--amber);background:var(--amber-soft)}
.danger{border-left:4px solid var(--red);background:var(--red-soft)}
.analogy p,.warn p,.danger p{margin:.15rem 0}
.table-wrap{overflow-x:auto;margin:1rem 0}
table{border-collapse:collapse;width:100%;font-size:.95rem;min-width:30rem}
th,td{text-align:left;padding:.55rem .7rem;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--display);font-weight:700}
ol.steps{padding-left:1.3rem}
ol.steps li{margin-bottom:.6rem;padding-left:.3rem}
code{font-family:var(--mono);font-size:.88em;background:var(--bg);padding:.1rem .35rem;border-radius:4px}
pre{font-family:var(--mono);font-size:.85rem;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:1rem;overflow-x:auto;line-height:1.5}
.lab{border:1.5px dashed var(--line);border-radius:12px;padding:1.25rem;margin:1.25rem 0}
.lab label{font-weight:700;display:block;margin-bottom:.35rem}
.lab input[type=text],.field{width:100%;font:inherit;padding:.6rem .75rem;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.hash-out{font-family:var(--mono);font-size:.85rem;word-break:break-all;background:var(--bg);padding:.6rem .75rem;border-radius:8px;margin-top:.6rem}
.note{margin:.6rem 0 0;font-size:.88rem;color:var(--muted)}
.ladder-controls{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem}
.ladder-controls input[type=range]{width:100%;accent-color:var(--violet)}
.reuse{display:flex!important;gap:.5rem;align-items:center;font-weight:400!important;margin-top:.3rem}
.ladder{display:grid;grid-template-columns:repeat(16,1fr);gap:4px}
.rung{aspect-ratio:1;border-radius:6px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;font-size:.72rem;color:var(--muted)}
.rung.secret{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.rung.public{background:var(--green);color:var(--paper);border-color:var(--green)}
.rung.known{background:var(--violet-soft);border-color:var(--violet);color:var(--violet)}
.rung.leak{background:var(--red);border-color:var(--red);color:#fff}
.ladder-axis{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);margin-top:.3rem}
.legend{display:flex;flex-wrap:wrap;gap:1rem;font-size:.85rem;margin:.8rem 0 0}
.legend b{display:inline-block;width:.9rem;height:.9rem;border-radius:3px;vertical-align:-2px;margin-right:.3rem}
.verdict{margin:.9rem 0 0;font-weight:700}
.conv{display:grid;grid-template-columns:1fr auto 1fr;gap:.6rem;align-items:end}
.conv span{padding-bottom:.6rem;color:var(--muted)}

.quiz{margin-top:2.25rem;border-top:1px solid var(--line);padding-top:1.25rem}
.quiz h2{margin-top:0}
.q{margin:0 0 1.25rem}
.q > p{font-weight:700;margin:0 0 .5rem}
.opts{display:grid;gap:.4rem}
.opts button{text-align:left;font-size:.97rem;padding:.6rem .85rem;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.opts button:hover{border-color:var(--violet)}
.opts button.right{background:var(--green-soft);border-color:var(--green)}
.opts button.wrong{background:var(--red-soft);border-color:var(--red)}
.feedback{font-size:.93rem;margin:.45rem 0 0;color:var(--muted)}
.complete-msg{display:none;background:var(--green-soft);color:var(--green);font-weight:700;border-radius:10px;padding:.7rem 1rem;margin-top:.5rem}
.complete-msg.show{display:block}
.pager{display:flex;justify-content:space-between;gap:1rem;margin-top:2rem;max-width:50rem}
.pager a{flex:1;text-decoration:none;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:.9rem 1.1rem}
.pager a:hover{border-color:var(--violet)}
.pager small{display:block;color:var(--muted)}
.pager .next{text-align:right}
.checklist{list-style:none;padding:0}
.checklist label{display:flex;gap:.6rem;align-items:flex-start;cursor:pointer;margin:.4rem 0}
.checklist input{margin-top:.35rem;accent-color:var(--green);width:1.05rem;height:1.05rem;flex:none}

/* glossary */
.gloss-search{max-width:28rem;margin-bottom:1.5rem}
.gloss{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.9rem}
.gloss div{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:1rem 1.2rem}
.gloss dt{font-family:var(--display);font-weight:700;font-size:1.05rem}
.gloss dd{margin:.25rem 0 0;color:var(--muted);font-size:.96rem}
.gloss dd a{font-size:.88rem}

/* exam + certificate */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:2.5rem;max-width:50rem;margin-top:2rem}
.score{font-family:var(--display);font-size:1.3rem;font-weight:800;margin:1rem 0 .3rem}
.cert{border:3px double var(--ink);border-radius:6px;padding:3rem 2rem;text-align:center;background:var(--paper);margin-top:1.5rem}
.cert small{color:var(--muted);display:block}
.cert h2{font-family:var(--display);font-weight:800;font-size:clamp(1.8rem,4vw,2.6rem);margin:.6rem 0}
.cert .who{font-family:var(--display);font-size:1.6rem;border-bottom:1px solid var(--line);display:inline-block;min-width:60%;padding:.3rem 1rem;margin:.5rem 0 1rem}
.locked{color:var(--muted)}

.cert-reward{margin-top:1.5rem;padding:1.2rem 1.4rem;border:1px solid var(--green);border-radius:12px;background:var(--green-soft);display:flex;gap:1rem;align-items:center;justify-content:space-between;flex-wrap:wrap}
.cert-reward p{margin:0}

.social-list{list-style:none;padding:0;margin:1.2rem 0}
.social-item{border:1px solid var(--line);border-radius:12px;padding:1rem 1.1rem;margin:.7rem 0;background:var(--bg)}
.social-item.ok{border-color:var(--green)}
.social-head{display:flex;gap:1rem;align-items:center;justify-content:space-between;flex-wrap:wrap}
.social-head b{font-family:var(--display);display:block}
.social-head span{color:var(--muted);font-size:.94rem}
.social-verify{margin-top:.7rem}
.social-verify label{font-weight:700;display:block;margin-bottom:.3rem}
.social-verify .field{max-width:22rem}
.social-check{display:flex;gap:.6rem;align-items:center;font-weight:400;cursor:pointer;margin:0}
.social-check input{accent-color:var(--green);width:1.05rem;height:1.05rem;flex:none}
.social-item.ok .social-head b::after{content:' \2713';color:var(--green)}
.btn.disabled{opacity:.5;cursor:not-allowed}

#app:focus{outline:none}
.cert-page{padding-top:2.5rem}
.cert-controls{display:flex;flex-wrap:wrap;gap:1rem;align-items:flex-end;margin-bottom:.5rem}
.cert-controls>div{flex:1;min-width:15rem;max-width:26rem}
.cert-controls label{font-weight:700;display:block;margin-bottom:.35rem}
#certCanvas{display:block;width:100%;height:auto;border-radius:10px;margin-top:1rem;box-shadow:0 2px 0 var(--line)}
footer.foot{max-width:1180px;margin:0 auto;padding:1.5rem;color:var(--muted);font-size:.88rem;border-top:1px solid var(--line)}

@media (max-width:900px){
  .home-hero{grid-template-columns:1fr;gap:2rem;padding:2.5rem 0 2rem}
  .facts{grid-template-columns:1fr 1fr}
  .level{grid-template-columns:1fr}
  .level-head{border-right:0;border-bottom:1px solid var(--line)}
  .lesson-layout{grid-template-columns:1fr;gap:1rem}
  .side{position:static}
  .side ol{display:none}
  article.lesson,.panel{padding:1.5rem 1.2rem}
  .gloss{grid-template-columns:1fr}
  .ladder-controls{grid-template-columns:1fr}
  .ladder{gap:2px}.rung{font-size:.58rem;border-radius:4px}
  .top-progress span{display:none}
  .topbar-in{gap:.75rem;padding:.6rem 1rem}
  .wrap{padding:0 1rem 4rem}
}
@media print{
  .topbar,footer.foot,.no-print{display:none!important}
  body{background:#fff}
}
</style>
</head>
<body>

/* ===== LEVEL 1 ===== */
{id:1,level:1,min:8,title:'Money, ledgers and blockchains',sub:'The shared record behind every cryptocurrency',
 obj:['Explain what a ledger is','Describe how blocks link into a chain','Know how Proof of Work mining adds blocks'],
 body:`<p>Every kind of money needs a record of who owns what. Your bank keeps that record in its own database, and you trust the bank to keep it honest.</p>
<p>A cryptocurrency replaces that single bank with a <strong>shared ledger</strong>: thousands of computers around the world keep a copy of the same record and agree on every change. Nobody owns it, nobody can quietly edit it, and it runs 24 hours a day.</p>
<div class="analogy"><p><strong>Think of it like this:</strong> a village notebook that every villager holds a copy of. When Ani pays Budi, the whole village writes it down. If one person changes their copy, it no longer matches, so it gets ignored.</p></div>
<h2>Why “blockchain”?</h2>
<p>New transactions are grouped into a <strong>block</strong>. Each block contains a fingerprint (a <em>hash</em>, covered in Lesson 4) of the block before it, so the blocks form a <strong>chain</strong>. Changing an old block breaks every fingerprint after it, which makes tampering obvious.</p>
<h2>Who adds the blocks?</h2>
<p>In Mochimo, as in Bitcoin, blocks are added by <strong>miners</strong> through <strong>Proof of Work</strong>. Computers compete to solve a hard puzzle; the winner adds the next block and earns newly created coins. This is how new MCM enters circulation.</p>`,
 quiz:[Q('Who keeps the record of balances in a cryptocurrency?',['One company that created the coin','Many computers that each hold a copy and agree on changes','The government'],1,'Right. The ledger is shared.','Not quite. There is no single keeper.'),
       Q('Why is it hard to secretly change an old block?',['Each block contains the previous block’s fingerprint','Old blocks are deleted daily','Only developers can read old blocks'],0,'Correct. Linked fingerprints expose tampering.','Think about what links one block to the next.')]},
{id:2,level:1,min:8,title:'Keys, wallets and signatures',sub:'What a wallet really holds',
 obj:['Tell addresses and private keys apart','Understand the recovery phrase','Explain custodial versus self‑custody'],
 body:`<p>A crypto wallet does not store coins. Coins always live on the shared ledger. Your wallet stores <strong>keys</strong>: secrets that prove you may move the coins recorded under your address.</p>
<div class="table-wrap"><table><thead><tr><th>Item</th><th>What it is</th><th>Share it?</th></tr></thead><tbody>
<tr><td>Address</td><td>Where people send you coins, like an account number</td><td>Yes</td></tr>
<tr><td>Private key</td><td>The secret that lets you spend</td><td>Never</td></tr>
<tr><td>Recovery phrase</td><td>Words that can rebuild all your keys</td><td>Never, with anyone</td></tr>
<tr><td>Signature</td><td>Proof, made with your key, that you approved a payment</td><td>Created automatically when you send</td></tr></tbody></table></div>
<div class="analogy"><p><strong>Think of it like this:</strong> your address is a glass mailbox anyone can drop money into. The private key is the only key that opens it.</p></div>
<h2>Custodial versus self‑custody</h2>
<p>Coins on an exchange are held with the exchange’s keys; you hold a promise. If the exchange is hacked or freezes withdrawals, you can lose access. Holding coins in a wallet where <em>you</em> keep the recovery phrase is <strong>self‑custody</strong>, the goal of Level 3.</p>
<div class="danger"><p><strong>Never break this rule:</strong> no real support agent, admin or developer will ever ask for your recovery phrase.</p></div>`,
 quiz:[Q('What does a crypto wallet store?',['The coins themselves','A copy of the whole blockchain','The keys that let you move coins on the ledger'],2,'Exactly.','Coins never leave the ledger.'),
       Q('What is safe to share with someone paying you?',['Your address','Your recovery phrase','Your private key'],0,'Right.','No. That would let them take your coins.')]},
{id:3,level:1,min:10,title:'Why quantum computers are a threat',sub:'The problem Mochimo was built to solve',
 obj:['Know why ECDSA is vulnerable','Understand “harvest now, decrypt later”','See why hash functions hold up better'],
 body:`<p>Bitcoin, Ethereum and most blockchains sign transactions with <strong>ECDSA</strong>. Its safety rests on one maths problem: recovering a private key from a public key would take ordinary computers longer than the age of the universe.</p>
<p>A large enough <strong>quantum computer</strong> running <strong>Shor’s algorithm</strong> solves exactly that problem. An attacker who sees your public key could calculate your private key and spend your coins.</p>
<h2>When is a public key exposed?</h2>
<p>On most ECDSA chains your public key becomes visible on the ledger once you spend from an address. Anyone can copy it and wait. This is called <strong>harvest now, decrypt later</strong>.</p>
<div class="warn"><p><strong>Keep it realistic:</strong> no quantum computer today can break ECDSA, and experts disagree on when one will. But migrating a whole blockchain takes years, so waiting for proof may be too late.</p></div>
<h2>What about hashes?</h2>
<p>Hash functions are much tougher. The best known quantum attack on them, Grover’s algorithm, only weakens them, and strong hashes keep a large safety margin. Mochimo builds its signatures on this.</p>`,
 quiz:[Q('What does Shor’s algorithm threaten?',['Miners’ internet connections','Signature schemes like ECDSA','Coin prices'],1,'Correct.','It is a maths attack on specific cryptography.'),
       Q('What does “harvest now, decrypt later” mean?',['Mine now, sell later','Quantum computers steal coins today','Collect public keys now and break them later'],2,'Yes.','Think about what attackers can save today.')]},
/* ===== LEVEL 2 ===== */
{id:4,level:2,min:15,title:'Hashes and WOTS+ signatures',sub:'The quantum‑resistant core of Mochimo',demo:'wots',
 obj:['See how a hash behaves','Understand a Winternitz hash ladder','Explain why WOTS+ keys are one‑time'],
 body:`<p>Instead of ECDSA, Mochimo signs every transaction with <strong>WOTS+</strong> (Winternitz One‑Time Signature Plus), built only from hash functions. Mochimo has used it since its first block in 2018 rather than retrofitting it later.</p>
<h2>Try a hash</h2>
<p>A hash turns any input into a fixed‑length fingerprint. Easy forward, practically impossible to reverse. Change one letter and the whole output changes.</p>
<div class="lab"><label for="hashIn">Type anything</label><input type="text" id="hashIn" value="Mochimo" autocomplete="off"><div class="hash-out" id="hashOut" aria-live="polite">…</div><p class="note">This demo runs SHA‑256 in your browser. Nothing is sent anywhere.</p></div>
<h2>The hash ladder</h2>
<p>WOTS+ starts from a secret and hashes it repeatedly, forming a ladder. The <strong>top rung</strong> is part of your public key. To sign, the wallet reveals the rung matching part of the message. Anyone can verify by hashing upward to the top, but nobody can go <em>down</em>.</p>
<p>Sign one message below, then tick “reuse the key” and sign a second one.</p>
<div class="lab">
 <div class="ladder-controls">
  <div><label for="d1">Message 1 reveals rung <span id="d1v">9</span></label><input type="range" id="d1" min="0" max="15" value="9"></div>
  <div><label for="d2">Message 2 reveals rung <span id="d2v">4</span></label><input type="range" id="d2" min="0" max="15" value="4" disabled><label class="reuse"><input type="checkbox" id="reuse"> Reuse the same key</label></div>
 </div>
 <div class="ladder" id="ladder" aria-hidden="true"></div>
 <div class="ladder-axis"><span>secret</span><span>public key</span></div>
 <div class="legend"><span><b style="background:var(--ink)"></b>Secret</span><span><b style="background:var(--violet-soft);border:1px solid var(--violet)"></b>Attacker can compute</span><span><b style="background:var(--red)"></b>Leaked by reuse</span><span><b style="background:var(--green)"></b>Public</span></div>
 <p class="verdict" id="verdict" aria-live="polite"></p>
</div>
<p>A built‑in checksum stops attackers abusing rungs above what you revealed. But a second signature with the same key can reveal a lower rung, and forgery becomes possible. Hence Mochimo’s rule: <strong>every spend uses a fresh key</strong>.</p>`,
 quiz:[Q('What is WOTS+ built from?',['Elliptic curves','Hash functions','Server‑side passwords'],1,'Correct.','Mochimo avoids elliptic curves entirely.'),
       Q('What happens if a WOTS+ key signs twice?',['Nothing, it is fine','It can leak enough secret material to allow forgery','The coins double'],1,'Exactly. One key, one signature.','Revisit the ladder demo with reuse ticked.')]},
{id:5,level:2,min:10,title:'Tags, addresses and key rotation',sub:'A stable address on top of one‑time keys',
 obj:['Understand what a tag is','Read a Mochimo v3 address','Know why one account should live on one device'],
 body:`<p>If every spend needs a new key, how do you give people a permanent address? Mochimo answers with the <strong>tag</strong>: a permanent account identifier that stays the same while the one‑time keys behind it rotate.</p>
<h2>What happens when you send</h2>
<ol class="steps"><li>Your wallet signs with the account’s current one‑time key.</li><li>The payment goes to the recipient.</li><li>Your remaining balance, the <strong>change</strong>, moves to a freshly generated key under the same tag.</li><li>The old key is never used again.</li></ol>
<p>You never manage this by hand; the wallet does it automatically.</p>
<h2>Mochimo v3 addresses</h2>
<p>Since the v3 hard fork, an address combines the tag with a hash of the current key. For everyday use it is shown in <strong>Base58</strong>, a compact text form with a built‑in checksum that catches typos. Always copy and paste addresses instead of retyping them.</p>
<div class="warn"><p><strong>Practical rule:</strong> use one wallet app per account at a time. Spending from the same account on two devices, or from an old restored backup, risks signing twice with the same one‑time key.</p></div>`,
 quiz:[Q('What stays the same when your one‑time keys rotate?',['The tag','The signature','The block number'],0,'Right. The tag is your permanent identity.','Think about what makes the address stable.'),
       Q('Why avoid spending from one account on two devices at once?',['It costs double fees','Both might sign with the same one‑time key','The wallet will uninstall'],1,'Correct.','Recall the one‑key, one‑signature rule.')]},
{id:6,level:2,min:10,title:'The Mochimo network',sub:'Consensus, ChainCollapse and supply',demo:'units',
 obj:['Recall Mochimo’s key facts','Understand ChainCollapse at a high level','Convert MCM and nanoMCM'],
 body:`<div class="table-wrap"><table><tbody>
<tr><th>Launched</th><td>Genesis block on 25 June 2018</td></tr>
<tr><th>Fundraising</th><td>No ICO or presale; coins enter circulation through mining</td></tr>
<tr><th>Signatures</th><td>WOTS+ (hash‑based, post‑quantum) since the first block</td></tr>
<tr><th>Consensus</th><td>Proof of Work</td></tr>
<tr><th>Codebase</th><td>Written in C, open source on GitHub</td></tr>
<tr><th>Current version</th><td>v3, introduced by a 2025 hard fork together with a browser extension wallet</td></tr></tbody></table></div>
<h2>ChainCollapse</h2>
<p>Blockchains grow forever, which makes running a node expensive over time. Mochimo periodically compresses history into a summary of current balances, so new nodes can join by downloading that summary and recent blocks instead of every block since 2018.</p>
<h2>Supply schedule</h2>
<p>Block rewards follow a phased schedule. From around block 900,000 (expected near December 2026), the reward becomes a fixed 1.25 MCM per block, a slow, capped release over the following decades.</p>
<h2>Units</h2>
<p>1 MCM = 1,000,000,000 nanoMCM. Some tools and APIs show amounts in nanoMCM, so it helps to convert quickly.</p>
<div class="lab"><div class="conv"><div><label for="uMcm">MCM</label><input class="field" type="text" id="uMcm" value="2.5" inputmode="decimal"></div><span>=</span><div><label for="uNano">nanoMCM</label><input class="field" type="text" id="uNano" inputmode="numeric"></div></div></div>
<div class="warn"><p><strong>Before buying:</strong> MCM is a small‑cap coin with low trading volume. Prices move sharply and large amounts can be hard to sell. This is education, not financial advice.</p></div>`,
 quiz:[Q('How did MCM first enter circulation?',['An ICO','An airdrop','Mining rewards, with no ICO'],2,'Right.','Mochimo had no presale.'),
       Q('What problem does ChainCollapse address?',['Quantum attacks','Ever‑growing chain size for nodes','Exchange listings'],1,'Correct.','Think about storage over time.')]},
/* ===== LEVEL 3 ===== */
{id:7,level:3,min:8,title:'Getting your first MCM',sub:'Buy, mine or receive, safely',
 obj:['Find current trading venues','Know the three ways to get MCM','Recognise common scams'],
 body:`<p>Set up your wallet first (Lesson 8) so you have a receiving address ready.</p>
<h2>Route A: buy on an exchange</h2>
<ol class="steps"><li>Find where MCM trades today on its <strong>Markets</strong> page on CoinMarketCap or CoinGecko. Listings change, so use a live source, not an old article.</li>
<li>Open the exchange by typing its address yourself. Create an account and enable two‑factor authentication.</li>
<li>Deposit a major coin such as USDT and buy on the MCM pair. Use limit orders, as the order book is thin.</li>
<li>Withdraw to your own wallet (Lesson 9).</li></ol>
<h2>Route B: mine it</h2>
<p>With suitable hardware you can mine and set your own address as the payout. Level 4 covers this.</p>
<h2>Route C: receive it</h2>
<p>Friends, community rewards and payments can go straight to your address. Share only the address.</p>
<div class="danger"><p><strong>Ignore these:</strong> “support” in direct messages, giveaways that ask you to send first, fake wallet apps, and any site that asks you to “validate” or “sync” your wallet with your recovery phrase.</p></div>`,
 quiz:[Q('Most reliable way to find where MCM trades today?',['A live Markets page on a price tracker','A years‑old blog post','A stranger’s DM'],0,'Correct.','Listings change; use a live source.'),
       Q('Someone in DMs offers to “sync” your wallet if you share your phrase. This is:',['Official support','A scam','A normal upgrade step'],1,'Right. Always a scam.','No legitimate party ever needs your phrase.')]},
{id:8,level:3,min:12,title:'Set up the Mochimo Wallet',sub:'Create a wallet you fully control',
 obj:['Install the official extension safely','Back up your recovery phrase correctly','Import an old Mojo wallet'],
 body:`<p>The official wallet for Mochimo v3 is the <strong>Mochimo Wallet</strong> browser extension for Chromium‑based browsers such as Chrome and Brave.</p>
<ol class="steps">
<li><strong>Install from the official listing only:</strong> <a href="https://chromewebstore.google.com/detail/mochimo-wallet/fkogefgjocnflhankmffnibdofdiiiho" rel="noopener">Mochimo Wallet on the Chrome Web Store</a>. Check the publisher before adding it.</li>
<li><strong>Pin the extension</strong> via the puzzle‑piece icon in your toolbar.</li>
<li><strong>Create a new wallet</strong> and set a strong password. It unlocks the wallet on this device only.</li>
<li><strong>Write the recovery phrase on paper</strong>, in order. No screenshots, email or cloud notes.</li>
<li><strong>Confirm the phrase</strong> when prompted.</li>
<li><strong>Store the paper privately</strong>, ideally in two separate places.</li>
<li><strong>Copy your receive address</strong> from the wallet.</li></ol>
<h2>Coming from the old Mojo wallet?</h2>
<p>Add an account, choose <strong>Import MCM file</strong>, select your <code>.mcm</code> backup, and enter your old Mojo password. Then compare the balance with your records.</p>
<div class="warn"><p><strong>Password versus phrase:</strong> a forgotten password is recoverable with the phrase. Lose both the phrase and the device and the coins are gone for good.</p></div>`,
 quiz:[Q('Best way to back up a recovery phrase?',['Phone screenshot','Email to yourself','Paper, stored privately in two places'],2,'Correct.','Anything online can be stolen remotely.'),
       Q('How do you avoid a fake wallet?',['Use the official store listing and check the publisher','Click the first search ad','Ask in a public chat'],0,'Right.','Ads and chat links spread fakes.')]},
{id:9,level:3,min:10,title:'Move MCM into your wallet',sub:'Your first self‑custody transfer',demo:'checklist',
 obj:['Withdraw safely with a test transfer','Send MCM later','Complete the safety checklist'],
 body:`<ol class="steps">
<li><strong>Copy your address</strong> with the wallet’s copy button.</li>
<li><strong>Paste it into the exchange’s MCM withdrawal page</strong> and check the first and last characters match.</li>
<li><strong>Send a small test amount</strong> and wait for it to arrive.</li>
<li><strong>Wait for confirmations.</strong> Each Mochimo block takes a few minutes, and exchanges may wait for several.</li>
<li><strong>Send the rest</strong> once the test succeeds.</li>
<li><strong>Check your balance.</strong> You now hold MCM in self‑custody, protected by quantum‑resistant signatures.</li></ol>
<h2>Sending later</h2>
<p>Choose Send, paste the recipient address, enter the amount and confirm. Key rotation happens automatically; your job is to protect the recovery phrase.</p>
<h2>Safety checklist</h2>
<ul class="checklist" id="checklist">
<li><label><input type="checkbox"> My recovery phrase is on paper, not on any device</label></li>
<li><label><input type="checkbox"> I installed the wallet from the official store listing</label></li>
<li><label><input type="checkbox"> I sent a small test transaction first</label></li>
<li><label><input type="checkbox"> I use this account on one device at a time</label></li>
<li><label><input type="checkbox"> I will never share my recovery phrase</label></li></ul>`,
 quiz:[Q('Why send a test amount first?',['It lowers the price','A wrong address costs only a little','The network requires it'],1,'Exactly. Transfers can’t be reversed.','Think about a mistyped address.'),
       Q('Who can reverse a transfer sent to the wrong address?',['The exchange','Mochimo developers','Nobody'],2,'Correct. Double‑check before sending.','Blockchain transfers are final.')]},
/* ===== LEVEL 4 ===== */
{id:10,level:4,min:15,title:'Run a Mochimo node',sub:'Help relay and verify the network',
 obj:['Know what a node does','Install a relay node on Ubuntu','Understand node versus miner roles'],
 body:`<p>A <strong>node</strong> keeps a copy of the ledger, checks every transaction and block against the rules, and shares them with peers. More independent nodes make the network harder to censor or attack.</p>
<h2>Requirements</h2>
<p>An always‑on Linux machine (Ubuntu is the documented target), build tools and git, and a public IP with the Mochimo port reachable if you want other peers and miners to connect.</p>
<h2>Install a relay node</h2>
<p>A relay node verifies and forwards data without mining. The official wiki’s steps:</p>
<pre>sudo apt-get install -y build-essential git-all
git clone https://github.com/mochimodev/mochimo ~/mochimo
make -C ~/mochimo version
make -C ~/mochimo install-mochimo
cd ~/mochimo/bin
./gomochi -n        # -n = relay only, no mining</pre>
<p>To update later, run <code>git -C ~/mochimo pull</code> and reinstall. The repository also ships a setup script that provisions a node as a system service; see the <a href="https://github.com/mochimodev/mochimo" rel="noopener">official README</a> for current options.</p>
<div class="warn"><p><strong>Always check the official repository</strong> before running commands. Build steps change between releases, and copied commands from old guides may be out of date.</p></div>`,
 quiz:[Q('What does the -n flag do for gomochi?',['Runs a relay node without mining','Enables quantum mode','Deletes the ledger'],0,'Correct.','Check the comment in the command block.'),
       Q('Why do more independent nodes help?',['They raise the coin price','They make the network harder to censor or attack','They speed up exchanges'],1,'Right.','Think about decentralisation.')]},
{id:11,level:4,min:15,title:'Mine MCM',sub:'Earn rewards by securing the chain',
 obj:['Know the mining hardware requirements','Build the GPU miner','Point rewards to your own address'],
 body:`<p>Mining adds new blocks through Proof of Work and pays the winner a block reward. The official GPU miner is built for <strong>NVIDIA</strong> cards on <strong>Linux</strong> and connects to a Mochimo node.</p>
<h2>What you need</h2>
<ul><li>An NVIDIA GPU (10‑series or newer recommended)</li><li>Linux with git, make and a CUDA Toolkit that matches your GPU</li><li>A running, publicly reachable Mochimo node (Lesson 10)</li><li>Your Mochimo account tag or address from the wallet (Lesson 8)</li></ul>
<h2>Build and run</h2>
<pre>git clone https://github.com/mochimodev/mochimo.git
make -C mochimo/ miner
# older 10-series cards may need the architecture flag:
# make -C mochimo/ miner NVCCARGS=-arch=sm_61
mochimo/bin/gpuminer --help
mochimo/bin/gpuminer -N &lt;YOUR_NODE_IP&gt; -m &lt;YOUR_ACCOUNT_TAG&gt;</pre>
<p>Replace <code>&lt;YOUR_NODE_IP&gt;</code> with your node’s IP and <code>&lt;YOUR_ACCOUNT_TAG&gt;</code> with your address, so rewards go to the wallet you control.</p>
<div class="warn"><p><strong>Count the cost:</strong> electricity, hardware wear and cooling are real expenses. Compare them with the current block reward and network difficulty before investing in rigs.</p></div>`,
 quiz:[Q('Where do mining rewards go?',['To the node operator automatically','To the account tag you pass with -m','To the exchange'],1,'Correct. Use your own address.','Look at the -m flag.'),
       Q('The official GPU miner targets which hardware?',['NVIDIA GPUs','Phones','Any CPU only'],0,'Right.','Check the requirements list.')]},
{id:12,level:4,min:15,title:'Build with the Mesh API',sub:'Read blockchain data from your own apps',
 obj:['Know what the Mesh API is','Run it against your node','Plan a simple integration'],
 body:`<p>The <strong>Mochimo Mesh API</strong> is the official interface for reading and searching blockchain data. It is written in Go and designed to follow the <strong>Rosetta/Mesh</strong> standard used by many exchanges and wallets, so integrators can reuse familiar tooling. Wallets also use it to submit transactions.</p>
<h2>How it fits together</h2>
<ol class="steps"><li>Your Mochimo node keeps the ledger.</li><li>The Mesh server connects to the node and exposes HTTP endpoints.</li><li>Your app sends <strong>POST requests with JSON</strong> to those endpoints.</li><li>With the optional indexer and a MySQL‑compatible database, you can also search transactions and follow block events.</li></ol>
<h2>Run it</h2>
<pre># with a node already running
./mesh -solo 0.0.0.0     # connect to your local node
./mesh -p 8081           # custom port
./mesh -cert cert.pem -key key.pem   # enable HTTPS</pre>
<p>Full endpoint list, flags and query examples are in the <a href="https://github.com/NickP005/mochimo-mesh" rel="noopener">mochimo-mesh repository</a>.</p>
<h2>Project ideas</h2>
<ul><li>A balance checker for a list of your own addresses</li><li>A dashboard of block times and transaction counts</li><li>Payment confirmation for a small online shop</li></ul>
<p>Remember that amounts come back in nanoMCM, so convert as in Lesson 6.</p>`,
 quiz:[Q('Which standard does the Mesh API aim to follow?',['Rosetta/Mesh','ERC‑20','SWIFT'],0,'Correct.','It’s named after the standard.'),
       Q('What do you need for transaction search?',['Nothing extra','The optional indexer with a database','A Google account'],1,'Right.','Search endpoints depend on the indexer.')]}
];

function makeId(){
  var c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',r='';
  var a=new Uint32Array(8);try{crypto.getRandomValues(a)}catch(e){for(var i=0;i<8;i++)a[i]=Math.random()*1e9}
  for(var j=0;j<8;j++){r+=c[a[j]%c.length];if(j===3)r+='-'}
  return 'MCMA-'+r;
}
var logoImg=null;
function drawCertificate(cv,d){
  var x=cv.getContext('2d'),W=cv.width,H=cv.height;
  var DARK='#1D2B2E',MINT='#15DC97',WHITE='#F2F7F6',MUTED='#8FA5A8',LINE='#2F4145';
  var DISP='"Bricolage Grotesque","Segoe UI",system-ui,sans-serif',BODY='"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif';
  x.clearRect(0,0,W,H);
  x.fillStyle=DARK;x.fillRect(0,0,W,H);
  /* frame */
  x.strokeStyle=MINT;x.lineWidth=3;x.strokeRect(56,56,W-112,H-112);
  x.strokeStyle=LINE;x.lineWidth=1.5;x.strokeRect(74,74,W-148,H-148);
  /* hash ladder motif, right side */
  var cell=58,gap=12,lx=W-230,ly=150;
  for(var i=0;i<16;i++){
    var y=ly+i*(cell+gap)*0.97, top=i===0;
    x.beginPath();x.roundRect?x.roundRect(lx,y,cell,cell,10):x.rect(lx,y,cell,cell);
    if(top){x.fillStyle=MINT;x.fill()}
    else{x.globalAlpha=0.08+0.5*(1-i/16);x.fillStyle=MINT;x.fill();x.globalAlpha=1}
  }
  x.fillStyle=MUTED;x.font='400 22px '+BODY;x.textAlign='center';
  x.save();x.translate(lx+cell/2+62,ly+ (16*(cell+gap)*0.97)/2);x.rotate(Math.PI/2);
  x.fillText('WOTS+ hash ladder: one key, one signature',0,0);x.restore();
  x.textAlign='left';
  /* header */
  var L=150;
  function drawLogo(){ if(logoImg&&logoImg.complete){x.save();x.beginPath();x.arc(L+70,210,70,0,Math.PI*2);x.clip();x.drawImage(logoImg,L,140,140,140);x.restore()} }
  drawLogo();
  x.fillStyle=WHITE;x.font='800 46px '+DISP;x.fillText('Mochimo Academy',L+170,202);
  x.fillStyle=MUTED;x.font='400 26px '+BODY;x.fillText('Post‑quantum blockchain curriculum',L+170,244);
  /* title */
  x.fillStyle=MINT;x.font='700 40px '+DISP;x.fillText('Certificate of completion',L,420);
  x.fillStyle=MUTED;x.font='400 30px '+BODY;x.fillText('Awarded to',L,500);
  /* name, auto-fit */
  var name=(d.name||'').trim()||'Your name',size=120,maxW=W-L-420;
  x.font='800 '+size+'px '+DISP;
  while(x.measureText(name).width>maxW&&size>54){size-=4;x.font='800 '+size+'px '+DISP}
  x.fillStyle=d.name&&d.name.trim()?WHITE:'#4E6468';x.fillText(name,L,500+size*1.05);
  var nb=500+size*1.05+34;
  x.fillStyle=MINT;x.fillRect(L,nb,180,6);
  /* statement */
  x.fillStyle=WHITE;x.font='400 32px '+BODY;
  var text='for completing all four levels of the Mochimo curriculum, from blockchain foundations and post‑quantum cryptography to self‑custody of MCM, and passing the final exam with a score of '+d.score+' out of 10.';
  var words=text.split(' '),line='',ty=nb+80,maxT=W-L-440;
  words.forEach(function(w){var t2=line?line+' '+w:w;if(x.measureText(t2).width>maxT){x.fillText(line,L,ty);line=w;ty+=48}else line=t2});
  x.fillText(line,L,ty);
  /* levels row */
  var levels=['Foundations','Inside Mochimo','Own your MCM','Builder track'];
  var ry=ty+95,rx=L;
  x.font='700 24px '+BODY;
  levels.forEach(function(n,i){
    var label='Level '+(i+1)+'  '+n, w=x.measureText(label).width+86;
    if(i===2||rx+w>W-400){rx=L;ry+=78}
    x.strokeStyle=MINT;x.lineWidth=2;x.beginPath();x.roundRect?x.roundRect(rx,ry-38,w,58,29):x.rect(rx,ry-38,w,58);x.stroke();
    x.fillStyle=MINT;x.beginPath();x.arc(rx+30,ry-9,13,0,Math.PI*2);x.fill();
    x.strokeStyle=DARK;x.lineWidth=3.5;x.beginPath();x.moveTo(rx+23,ry-9);x.lineTo(rx+28,ry-3);x.lineTo(rx+38,ry-15);x.stroke();
    x.fillStyle=WHITE;x.fillText(label,rx+56,ry);
    rx+=w+18;
  });
  /* footer */
  var fy=H-190;
  x.fillStyle=LINE;x.fillRect(L,fy-70,W-L-420,1.5);
  function col(cx,label,value){x.fillStyle=MUTED;x.font='400 22px '+BODY;x.fillText(label,cx,fy-20);x.fillStyle=WHITE;x.font='700 30px '+BODY;x.fillText(value,cx,fy+22)}
  var dt=new Date(d.date+'T00:00:00'),ds=isNaN(dt)?d.date:dt.getDate()+' '+['January','February','March','April','May','June','July','August','September','October','November','December'][dt.getMonth()]+' '+dt.getFullYear();
  col(L,'Date issued',ds);
  col(L+420,'Final exam',d.score+' / 10');
  col(L+760,'Issued by','Mochimo Academy');
  col(L+1160,'Certificate ID',d.id);
  if(!logoImg){logoImg=new Image();logoImg.onload=function(){drawCertificate(cv,d)};logoImg.src=LOGO}
}
function viewNotFound(){app.innerHTML='<div class="panel"><h1 class="section-title">Page not found</h1><p>That page does not exist. Head back to the curriculum to pick a lesson.</p><a class="btn" href="#/curriculum">Open the curriculum</a></div>'}

/* ---------- demos ---------- */
function initWots(){
  var hin=document.getElementById('hashIn'), hout=document.getElementById('hashOut');
  function doHash(){
    if(!(window.crypto&&crypto.subtle)){hout.textContent='Your browser does not support this demo.';return}
    crypto.subtle.digest('SHA-256',new TextEncoder().encode(hin.value)).then(function(buf){
      hout.textContent=Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0')}).join('')});
  }
  hin.oninput=doHash; doHash();
  var lad=document.getElementById('ladder');
  for(var i=0;i<16;i++){var r=document.createElement('div');r.className='rung';r.textContent=i;lad.appendChild(r)}
  var d1=document.getElementById('d1'),d2=document.getElementById('d2'),re=document.getElementById('reuse'),v=document.getElementById('verdict');
  function draw(){
    var a=+d1.value,b=+d2.value,ru=re.checked,low=ru?Math.min(a,b):a;
    document.getElementById('d1v').textContent=a;document.getElementById('d2v').textContent=b;d2.disabled=!ru;
    lad.querySelectorAll('.rung').forEach(function(el,x){
      el.className='rung';
      if(x===15)el.classList.add('public');
      else if(x>=a)el.classList.add('known');
      else if(ru&&x>=low)el.classList.add('leak');
      else if(x===0)el.classList.add('secret');
    });
    if(!ru){v.style.color='var(--green)';v.textContent='One signature: the attacker can only hash upward from rung '+a+'. The checksum blocks forgery, so the key is safe.'}
    else if(b<a){v.style.color='var(--red)';v.textContent='Key reused: rungs '+b+' to '+(a-1)+' are now exposed. Combining both signatures makes forgery possible.'}
    else{v.style.color='var(--amber)';v.textContent='Key reused: nothing new leaked on this rung, but across the many rungs of a real signature, reuse almost always exposes some. Never sign twice.'}
  }
  [d1,d2,re].forEach(function(el){el.oninput=draw;el.onchange=draw});draw();
}
function initUnits(){
  var m=document.getElementById('uMcm'),n=document.getElementById('uNano');
  function fromM(){var s=m.value.trim();if(!/^\d*\.?\d{0,9}$/.test(s)||s===''||s==='.'){n.value='';return}
    var p=s.split('.'),w=p[0]||'0',f=(p[1]||'').padEnd(9,'0');n.value=(BigInt(w)*1000000000n+BigInt(f)).toString()}
  function fromN(){var s=n.value.trim();if(!/^\d+$/.test(s)){m.value='';return}
    var b=BigInt(s),w=b/1000000000n,f=(b%1000000000n).toString().padStart(9,'0').replace(/0+$/,'');m.value=w.toString()+(f?'.'+f:'')}
  m.oninput=fromM;n.oninput=fromN;fromM();
}
function initChecklist(){
  document.querySelectorAll('#checklist input').forEach(function(c,i){
    c.checked=!!state.checks[i];c.onchange=function(){state.checks[i]=c.checked;save()};
  });
}

/* ---------- router ---------- */
function route(){
  var h=location.hash.replace(/^#/,'')||'/', parts=h.split('/').filter(Boolean), key=parts[0]||'home';
  document.querySelectorAll('[data-nav]').forEach(function(a){a.classList.toggle('active',a.dataset.nav===key||(key==='lesson'&&a.dataset.nav==='curriculum'))});
  if(key==='home')viewHome();
  else if(key==='curriculum')viewCurriculum();
  else if(key==='lesson')viewLesson(parseInt(parts[1],10));
  else if(key==='glossary')viewGlossary();
  else if(key==='exam')viewExam();
  else if(key==='certificate')viewCertificate();
  else if(key==='requirements')viewSocial();
  else viewNotFound();
  window.scrollTo(0,0);
  if(key!=='home')app.focus({preventScroll:true});
}
window.addEventListener('hashchange',route);
updateRing();route();
})();
